<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Painel | A&amp;A Select</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=PT+Serif:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Impede que o painel seja aberto dentro de outro site (clickjacking) -->
    <style>
      html {
        visibility: hidden;
      }
    </style>
    <script>
      if (window.top === window.self) {
        document.documentElement.style.visibility = "visible";
      } else {
        window.top.location = window.self.location;
      }
    </script>
    <link rel="stylesheet" href="style.css?v=3" />
    <link rel="stylesheet" href="admin.css?v=3" />
  </head>

  <body>
    <!-- ========== LOGIN ========== -->
    <main class="login" id="loginView" hidden>
      <form class="login-card" id="loginForm">
        <a class="logo" href="index.html">A&amp;A <b>SELECT</b></a>
        <h1>Painel de produtos</h1>
        <input type="email" id="email" placeholder="E-mail" autocomplete="username" required />
        <input type="password" id="password" placeholder="Senha" autocomplete="current-password" required />
        <p class="form-error" id="loginError" role="alert"></p>
        <button class="btn" type="submit" id="loginBtn">Entrar</button>
        <a class="back" href="index.html">Voltar ao site</a>
      </form>
    </main>

    <!-- ========== PAINEL ========== -->
    <div id="dashView" hidden>
      <header>
        <div class="wrap bar">
          <a class="logo" href="index.html">A&amp;A <b>SELECT</b></a>
          <div class="bar-actions">
            <a class="link" href="index.html" target="_blank" rel="noopener">Ver site</a>
            <button class="btn ghost small" id="logoutBtn">Sair</button>
          </div>
        </div>
      </header>

      <main class="wrap dash">
        <div class="dash-head">
          <div>
            <div class="eyebrow">Painel</div>
            <h1>Produtos</h1>
          </div>
          <div class="dash-actions">
            <button class="btn ghost" id="catsBtn">Categorias</button>
            <button class="btn" id="newBtn">+ Novo produto</button>
          </div>
        </div>

        <div class="stats" id="stats"></div>

        <div class="tools">
          <input class="search" id="search" type="search" placeholder="Buscar produto" aria-label="Buscar produto" />
          <select id="filterCategory" aria-label="Filtrar por categoria"></select>
        </div>

        <p class="result-count" id="resultCount" aria-live="polite"></p>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th></th>
                <th>Produto</th>
                <th>Categoria</th>
                <th>Preço</th>
                <th>Visível</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <p class="table-empty" id="tableEmpty"></p>
        </div>
      </main>
    </div>

    <!-- ========== MODAL: ADICIONAR / EDITAR ========== -->
    <dialog id="modal">
      <form id="productForm">
        <h2 id="modalTitle">Novo produto</h2>

        <label>
          Nome
          <input id="fName" required maxlength="120" />
        </label>

        <div class="two">
          <label>
            Preço (R$)
            <input id="fPrice" inputmode="decimal" placeholder="Vazio = Sob consulta" />
          </label>
          <label>
            Categoria
            <select id="fCategory" required></select>
          </label>
        </div>

        <div class="image-field">
          <div class="thumb big" id="fPreview"></div>
          <div>
            <label class="btn ghost small file">
              Escolher foto
              <input type="file" id="fFile" accept="image/*" hidden />
            </label>
            <button type="button" class="btn ghost small" id="fRemoveImg" hidden>Remover foto</button>
            <p class="hint">A foto é reduzida automaticamente para carregar rápido.</p>
          </div>
        </div>

        <label class="check">
          <input type="checkbox" id="fActive" checked />
          Visível no site
        </label>

        <p class="form-error" id="formError" role="alert"></p>

        <div class="actions">
          <button type="button" class="btn ghost" id="cancelBtn">Cancelar</button>
          <button type="submit" class="btn" id="saveBtn">Salvar</button>
        </div>
      </form>
    </dialog>

    <!-- ========== MODAL: CATEGORIAS ========== -->
    <dialog id="catModal">
      <h2>Categorias</h2>

      <form id="catForm">
        <label>
          Nova categoria
          <div class="inline-field">
            <input id="catName" required maxlength="40" placeholder="Ex.: Unissex" />
            <button type="submit" class="btn small" id="catAddBtn">Adicionar</button>
          </div>
        </label>
      </form>

      <p class="hint">Renomear a categoria atualiza todos os produtos dela. Só dá para excluir categorias sem produtos.</p>
      <ul class="cat-list" id="catList"></ul>
      <p class="form-error" id="catError" role="alert"></p>

      <div class="actions">
        <button type="button" class="btn ghost" id="catCloseBtn">Fechar</button>
      </div>
    </dialog>

    <div class="toast" id="toast"></div>

    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"
      integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug"
      crossorigin="anonymous"
    ></script>
    <script src="config.js?v=3"></script>
    <script src="admin.js?v=3"></script>
  </body>
</html>
